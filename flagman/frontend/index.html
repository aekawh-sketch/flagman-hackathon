<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Склад ресторана: партии, сроки годности, стоп-лист, горячие предложения" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Склад ресторана</title>
    <script>
      // Тема до загрузки React — без мигания.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      /* Печать этикетки партии: на бумагу попадает только она. */
      @media print {
        body.printing-label * { visibility: hidden; }
        body.printing-label .print-label, body.printing-label .print-label * { visibility: visible; }
        body.printing-label .print-label { position: fixed; left: 0; top: 0; width: 80mm; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
