# Склад «Флагман» на VPS: http://31.76.28.248:8085 — интерфейс и API на одном адресе (для Android-приложения тоже).
# Сайт ИСТОК с панелью ресторана (касса): http://31.76.28.248:8086 — ходит в склад внутри сети Docker по ключу сайта.
# Портал поставщика: http://31.76.28.248:8087 — шлёт накладные в склад по API ключом поставщика.
# Секреты — в .env рядом (DB_PASSWORD, SITE_API_KEY, SUPPLIER_API_KEY, ADMIN_TOKEN, REDIS_PASSWORD), их создаёт deploy.sh;
# в git не попадают.
name: flagman

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flagman
      POSTGRES_USER: flagman
      POSTGRES_PASSWORD: ${DB_PASSWORD:?нет DB_PASSWORD в .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagman -d flagman"]
      interval: 5s
      retries: 20
    # Наружу база не открыта — только сервер склада в этой же сети Docker
    mem_limit: 512m

  # Redis: сессии сотрудников, общий кеш меню и горячих предложений, счётчики входа и запросов, события между
  # серверами склада (Pub/Sub). Наружу не открыт, с паролем. Пишет на диск (AOF): перезапуск не выкидывает сотрудников.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?нет REDIS_PASSWORD в .env}
    # У всех ключей склада есть срок жизни — при нехватке памяти Redis вытесняет давно не нужные (volatile-lru)
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 96mb --maxmemory-policy volatile-lru"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      retries: 20
    mem_limit: 128m

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/flagman
      DB_USER: flagman
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DEMO_MODE: "true"           # демо-панель и генератор заказов — это демо-стенд
      SEED: "true"                # пустая база — демо-ресторан ИСТОК за ~10 с
      CORS_ORIGINS: http://31.76.28.248:8085
      SITE_API_KEY: ${SITE_API_KEY:?нет SITE_API_KEY в .env}   # склад заводит ключ сайта при запуске
      SUPPLIER_API_KEY: ${SUPPLIER_API_KEY:?нет SUPPLIER_API_KEY в .env}   # и ключ портала поставщика
      PANEL_URL: http://31.76.28.248:8086/panel/login.html     # ссылка «Касса» у кассира
      TZ: Europe/Moscow
    volumes:
      - uploads:/data
    ports:
      - "8085:8080"
    mem_limit: 900m

  istok:
    build:
      context: .
      dockerfile: Dockerfile.istok
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: flagman
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME_KUSH: istok_kush
      DB_NAME_KAN: istok_kan
      FLAGMAN_URL: http://app:8080
      FLAGMAN_API_KEY: ${SITE_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?нет ADMIN_TOKEN в .env}
      TZ: Europe/Moscow
    volumes:
      - istok-orders:/app/server/orders     # ежедневные выгрузки заказов в Excel
    ports:
      - "8086:3001"
    mem_limit: 300m

  supplier:
    build:
      context: .
      dockerfile: Dockerfile.supplier
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      FLAGMAN_URL: http://app:8080
      FLAGMAN_API_KEY: ${SUPPLIER_API_KEY}
      TZ: Europe/Moscow
    ports:
      - "8087:3002"
    mem_limit: 128m

volumes:
  db:
  redis:
  uploads:
  istok-orders:
