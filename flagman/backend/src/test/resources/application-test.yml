spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/flagman_test}
  flyway:
    clean-disabled: false

stock:
  seed: false
  uploads-dir: ./target/test-uploads
  # Свой префикс у каждого прогона: кеш и счётчики прошлых прогонов (и рабочего склада) не мешают тестам
  redis:
    prefix: "flagman-test-${random.uuid}:"
